<h1>Hello, World README</h1>

<p>Quick description of a Hello World module for lux.</p>

<p>This is one of the simplest ways to get started writing an extension with lux.</p>

<h2>Usage</h2>

<p>To get this package working, we can use this syntax for now</p>

<p><code>
lxpkg -i https://luxserver.org/package/hello_world -a &lt;path-to-instance&gt;
</code></p>
