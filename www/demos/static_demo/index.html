<html>

<head>
<style type=text/css>
/*Borrowed and modified from http://meyerweb.com/eric/tools/css/reset/ */
html, body, div, 
h1, h2, h3, h4, h5, h6, 
p, pre,
a, img, b, u, i, center, dl, dt, dd, ol, ul, li,
fieldset, form, label, legend, table, caption, 
tbody, tfoot, thead, tr, th, td, article, aside, 
canvas, details, embed, figure, figcaption, 
footer, header, hgroup, menu, nav, output, ruby, 
section, summary, time, mark, audio, video {
	margin: 0;
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after, q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}
html {
	background-color: #333;
	font-family: Helvetica;
	font-size: 0.9em;
	color: #ddd;
	scroll-behavior: smooth;
}
pre {
	font-family: "Lucida Console", "Lucida Sans Typewriter", monaco, "Bitstream Vera Sans Mono", monospace;
	width: 96%;
	margin: 0 auto;
	background-color: white;
	color: black;
	margin-top: 20px;
	padding: 2%;
}

.center {
	text-align: center;
}

.container {
	padding-top: 50px;
	width: 59%;
	min-width: 400px;
	max-width: 600px;
	padding-bottom: 50px;
	margin: 0 auto;
}

.container-section {
	position: relative;
	width: 95%;
	margin: 0 auto;
	margin-bottom: 20px;
	margin-top: 20px;
}

.container-footer {
	font-size: 10px;
}

.container-section:not( :nth-child(1) ) {
	border-top: 5px solid white;
}

.container-dark-line {
	border-top: 5px solid #333;
}

.container-light-line {
	border-top: 5px solid #ccc;
}

h1, h2, h3, h4, h5, h6 {
	transition: font-size 0.2s;
	font-weight: bold;
	color: white;
	letter-spacing: -3px;
}

p {
	transition: font-size 0.2s,
			width 0.2s;
}

a {
	transition: background-color 0.2s
		  , color 0.2s;
}

h1 { font-size: 6em;  }
h2 { font-size: 5em; }
h3 { font-size: 4em; }
h4 { font-size: 3em; }
h5 { font-size: 2em; }

a {
	background-color: #333;
	color: white;
}

a:hover {
	background-color: white;
	color: black;
}

p {
	font-size: 1.4em;
	margin-top: 30px;
	letter-spacing: -0.5px;
}

.images {
	width: 100%;
	position: relative;
	display: flex;
	gap: 10px;
	align-items: center;
	padding-top: 20px;
}

.images > img {
	width: 100%;
}

</style>
</head>


<body>
	<div class="container">
		<div class="container-section">
			<h1>Greetings</h1>
			<p>If you are seeing this page, then you have successfully installed <a href="https://luxserver.org">lux</a> on your system.</p>
			<p>You are currently looking at the example page for your new site located at <b>@model_dir@</b>.</p>
		</div>

		<!-- simple three column for testing -->
		<div class="container-section images">
			<img src="./img/UK-Escort-09-1200x750.webp">
			<img src="./img/1999-Toyota-Altezza-front.webp">
			<img src="./img/2006-accord-honda-ex.webp">
		</div>
		
		<div class="container-section container-footer">
			<p>Proudly designed by <a href="http://ramarcollins.com">rwk</a></p>
		</div>
	</div>
</body>
</html>
